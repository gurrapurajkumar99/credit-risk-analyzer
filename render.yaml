services:
  - type: web
    name: credit-risk-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CREDIT_RISK_DB
        value: /tmp/credit_risk.db
